services:
  db:
    build:
      context: https://github.com/mazoochian/signal-scope-db.git#main
    image: signal-scope-db:latest
    container_name: signal-scope-db
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: signalscope
      POSTGRES_USER: signalscope
      POSTGRES_PASSWORD: "${DB_PASS:-signalscope}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "signalscope", "-d", "signalscope"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: signal-scope-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: https://github.com/mazoochian/signal-scope-be.git#main
    image: signal-scope-api:latest
    container_name: signal-scope-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: signalscope
      DB_USER: signalscope
      DB_PASS: "${DB_PASS:-signalscope}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Required — device credentials are encrypted at rest with this key.
      # The API refuses to boot without it (see AUDIT-REPORT.md C1: never
      # silently default a secret). Generate with:
      #   openssl rand -hex 32
      CREDENTIAL_ENC_KEY: "${CREDENTIAL_ENC_KEY:?CREDENTIAL_ENC_KEY must be set — see .env.example}"
      # Required — signs/verifies session JWTs. The API refuses to boot
      # without it (see AUDIT-REPORT.md C1: the previous hardcoded fallback
      # was a complete auth bypass). Generate with: openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set — see .env.example}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-http://localhost:4000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /api/overview requires auth (dashboard:read) — the healthcheck sent
      # no credentials, so it always 401'd and the frontend (which waits on
      # this being healthy) could never start (see AUDIT-REPORT.md C3).
      # /api/health is a dedicated public route that also pings the DB.
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: https://github.com/mazoochian/signal-scope-fe.git#main
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
    image: signal-scope-fe:latest
    container_name: signal-scope-fe
    restart: unless-stopped
    ports:
      - "${FE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_URL: "http://api:4000"
      # Same secret as the api service — middleware.ts verifies the session
      # JWT at the edge (AUDIT-REPORT.md M5) instead of just checking cookie
      # presence, so it must match what the API signs tokens with.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set — see .env.example}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
