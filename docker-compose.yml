services:
  db:
    build:
      context: https://github.com/mazoochian/signal-scope-db.git#main
    image: signal-scope-db:latest
    container_name: signal-scope-db
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: signalscope
      POSTGRES_USER: signalscope
      POSTGRES_PASSWORD: "${DB_PASS:-signalscope}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "signalscope", "-d", "signalscope"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: signal-scope-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: https://github.com/mazoochian/signal-scope-be.git#main
    image: signal-scope-api:latest
    container_name: signal-scope-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: signalscope
      DB_USER: signalscope
      DB_PASS: "${DB_PASS:-signalscope}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Required — device credentials are encrypted at rest with this key.
      # The API refuses to boot without it (see AUDIT-REPORT.md C1: never
      # silently default a secret). Generate with:
      #   openssl rand -hex 32
      CREDENTIAL_ENC_KEY: "${CREDENTIAL_ENC_KEY:?CREDENTIAL_ENC_KEY must be set — see .env.example}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/overview"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: https://github.com/mazoochian/signal-scope-fe.git#main
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
    image: signal-scope-fe:latest
    container_name: signal-scope-fe
    restart: unless-stopped
    ports:
      - "${FE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_URL: "http://api:4000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
